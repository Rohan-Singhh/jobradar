{# Everything a search engine or a link preview reads, for one page. #}
{% macro head(page, site) -%}
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ site.url }}{{ page.path }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="{{ site.author.name }}">
<link rel="author" href="{{ site.url }}{{ site.author.path }}">
<meta property="og:type" content="{{ page.og_type or 'website' }}">
<meta property="og:site_name" content="Job Radar">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.path }}">
<meta property="og:image" content="{{ site.url }}/static/img/grid.webp">
<meta property="og:image:width" content="1400">
<meta property="og:image:height" content="900">
<meta property="og:image:alt" content="The Job Radar grid: one tile per open job, tinted green by how well it matches the resume">
<meta name="twitter:card" content="summary_large_image">
{% if site.verification %}<meta name="google-site-verification" content="{{ site.verification }}">
{% endif %}
{%- for block in page.jsonld %}
<script type="application/ld+json">{{ block | tojson }}</script>
{%- endfor %}
{%- endmacro %}

{% macro favicon() -%}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2343a273' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2343a273'/%3E%3C/svg%3E">
{%- endmacro %}
